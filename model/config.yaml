model_name: PKAcycleMOR
model_dir: 'PKAcycleMOR'
tolerances:
  atol: 1.e-10          # amici_solver.setAbsoluteTolerance, sets the absolute error tolerance for the ODE solver during forward integration
  rtol: 1.e-13          # amici_solver.setRElativeTolerance, sets the relative error tolerance for the ODE solver during forward integration
  max_steps: 10000000   # amici_solver.setMaxSteps, sets the maximum number of steps for the ODE solver during forward integration
  n_threads: 1
#  SteadyStateSensitivityMode: 'newtonOnly'
simulate:
  n_threads: 1
  n_simulations: 1000
optimize:
  n_procs: 1
  n_optimizations: 2
  optimizer:
    name: fides
    exitflags: [1]
    optimizer_options:
      maxiter: 500
      autosave: False
      save_histories: True
petab_model_yaml: PKAcycleMOR.yaml

